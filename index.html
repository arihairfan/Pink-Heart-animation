<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Heart Animation</title>
    <style>
        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: black;
        }
    </style>
</head>
<body>

    <canvas id="heart-canvas" width="600" height="600"></canvas>

    <script>
        const canvas = document.getElementById("heart-canvas");
        const ctx = canvas.getContext("2d");

        // Center the canvas coordinates
        ctx.translate(canvas.width / 2, canvas.height / 2);

        let i = 0;

        function drawHeart() {
            if (i >= 120) return; // Stop when 120 points are drawn

            let angle = i * (Math.PI * 2) / 120;
            
            // Heart math formula equations translated to JavaScript
            let x = 16 * Math.pow(Math.sin(angle), 3) * 15;
            let y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * 15;

            // Set the color to a clean, vibrant pink
            ctx.strokeStyle = "#ff69b4";
            ctx.lineWidth = 3;

            // Draw lines step by step just like the colorful version
            ctx.beginPath();
            ctx.moveTo(0, -40);
            ctx.lineTo(x, y);
            ctx.stroke();

            i++;
            setTimeout(drawHeart, 50); // Speed of the animation
        }

        // Start the animation immediately on first load
        drawHeart();
    </script>

</body>
</html>
